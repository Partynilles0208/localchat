<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYTHIC - Encrypted Comms</title>
    <style>
        :root {
            --bg-base: #020203;
            --surface-glass: rgba(12, 12, 16, 0.65);
            --surface-highlight: rgba(255, 255, 255, 0.04);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(0, 229, 255, 0.15);
            --accent-cyan: #00e5ff;
            --accent-purple: #7000ff;
            --text-main: #e2e2e2;
            --text-dim: #7a7a85;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "Courier New", Courier, monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background FX */
        .ambient-glow {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.03) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(112, 0, 255, 0.03) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.4;
            pointer-events: none;
        }

        /* --- REVEAL SCREEN --- */
        #reveal-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-base);
            transition: opacity 1s cubic-bezier(0.8, 0, 0.2, 1), transform 1s ease;
        }

        .nythic-logo { width: 90px; height: 90px; overflow: visible; }
        .nythic-path {
            fill: transparent;
            stroke: #fff;
            stroke-width: 1.5;
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: drawLine 1.8s cubic-bezier(0.8, 0, 0.2, 1) forwards,
                       fillIn 1.2s cubic-bezier(0.8, 0, 0.2, 1) 1.5s forwards;
        }

        .brand-text {
            margin-top: 2rem;
            color: transparent;
            font-size: 1.1rem;
            letter-spacing: 0.8rem;
            text-indent: 0.8rem;
            font-family: var(--font-mono);
            animation: textFade 1.5s ease-out 1.5s forwards;
        }

        @keyframes drawLine { to { stroke-dashoffset: 0; } }
        @keyframes fillIn { 0% { fill: transparent; stroke-width: 1.5; } 100% { fill: #fff; stroke-width: 0; filter: drop-shadow(0 0 20px rgba(255,255,255,0.4)); } }
        @keyframes textFade { 0% { color: transparent; text-shadow: 0 0 0 transparent; } 100% { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.2); } }

        /* --- CHAT APP UI --- */
        #chat-app {
            position: relative;
            z-index: 10;
            width: 95vw;
            max-width: 1600px;
            height: 92vh;
            display: flex;
            background: var(--surface-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.02);
            opacity: 0;
            transform: scale(0.98) translateY(10px);
            pointer-events: none;
            transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s;
            overflow: hidden;
        }

        #chat-app.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: all;
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            background: rgba(5, 5, 8, 0.4);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-title {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            letter-spacing: 0.2rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .search-container {
            padding: 16px 24px;
        }

        .search-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border 0.3s;
        }

        .search-box:focus-within {
            border-color: rgba(255,255,255,0.2);
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.85rem;
            width: 100%;
            outline: none;
        }

        .search-box input::placeholder { color: var(--text-dim); }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 12px 12px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            margin-bottom: 4px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .chat-item:hover {
            background: var(--surface-highlight);
        }

        .chat-item.active {
            background: rgba(0, 229, 255, 0.03);
            border: 1px solid var(--border-glow);
            box-shadow: inset 4px 0 0 var(--accent-cyan);
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            margin-right: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 1.1rem;
            border: 1px solid var(--border-subtle);
            position: relative;
        }

        .avatar.online::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            background: var(--accent-cyan);
            border: 2px solid var(--bg-base);
            border-radius: 50%;
        }

        .chat-info { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .chat-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .chat-name { font-size: 0.95rem; font-weight: 500; color: #fff; }
        .chat-time { font-size: 0.7rem; color: var(--text-dim); }
        .chat-preview { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Main Chat Window */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            height: 80px;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(255,255,255,0.01);
        }

        .chat-header-left { display: flex; align-items: center; gap: 16px; }
        
        .chat-header h2 { font-size: 1.1rem; font-weight: 500; margin: 0; color: #fff; }
        
        .security-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--accent-cyan);
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0, 229, 255, 0.05);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid rgba(0, 229, 255, 0.1);
        }

        .messages-container {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .message {
            max-width: 70%;
            display: flex;
            flex-direction: column;
        }

        .message.received { align-self: flex-start; }
        .message.sent { align-self: flex-end; align-items: flex-end; }

        .msg-content {
            padding: 16px 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            color: #dcdcdc;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Custom UI Bubbles */
        .message.received .msg-content {
            background: rgba(25, 25, 30, 0.8);
            border: 1px solid var(--border-subtle);
            border-left: 3px solid var(--text-dim);
            border-radius: 4px 12px 12px 12px;
        }

        .message.sent .msg-content {
            background: linear-gradient(145deg, rgba(0, 229, 255, 0.05), rgba(0,0,0,0.2));
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-right: 3px solid var(--accent-cyan);
            border-radius: 12px 4px 12px 12px;
        }

        .msg-meta {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 8px;
            font-family: var(--font-mono);
            display: flex;
            gap: 8px;
        }

        /* Input Area */
        .input-area {
            padding: 24px 32px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid var(--border-subtle);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(10, 10, 15, 0.6);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 6px 12px;
            transition: all 0.3s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .input-wrapper:focus-within {
            border-color: rgba(0, 229, 255, 0.3);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2), 0 0 15px rgba(0, 229, 255, 0.05);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .input-wrapper input::placeholder { color: #555560; }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .send-btn {
            background: var(--text-main);
            color: var(--bg-base);
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: 8px;
        }

        .send-btn:hover {
            background: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>
    <canvas id="particle-canvas"></canvas>

    <!-- INITIAL REVEAL SCREEN -->
    <div id="reveal-screen">
        <svg class="nythic-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path class="nythic-path" d="M20,80 L20,20 L60,60 L80,20 L80,80 L60,80 L60,40 L40,60 L20,80 Z" />
        </svg>
        <div class="brand-text">NYTHIC</div>
    </div>

    <!-- MAIN CHAT INTERFACE -->
    <div id="chat-app">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-title">
                    <div class="status-dot"></div>
                    NYTHIC
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-box">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" placeholder="Search transmissions...">
                </div>
            </div>

            <div class="chat-list">
                <div class="chat-item active">
                    <div class="avatar online">V</div>
                    <div class="chat-info">
                        <div class="chat-header-row">
                            <span class="chat-name">Vortex Node</span>
                            <span class="chat-time">14:47</span>
                        </div>
                        <span class="chat-preview">Uplink established. Awaiting input.</span>
                    </div>
                </div>
                <div class="chat-item">
                    <div class="avatar">S</div>
                    <div class="chat-info">
                        <div class="chat-header-row">
                            <span class="chat-name">Syndicate</span>
                            <span class="chat-time">11:20</span>
                        </div>
                        <span class="chat-preview">Encrypted payload received.</span>
                    </div>
                </div>
                <div class="chat-item">
                    <div class="avatar">E</div>
                    <div class="chat-info">
                        <div class="chat-header-row">
                            <span class="chat-name">Ehoser Root</span>
                            <span class="chat-time">YESTERDAY</span>
                        </div>
                        <span class="chat-preview">System update deployed successfully.</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="main-chat">
            <header class="chat-header">
                <div class="chat-header-left">
                    <div class="avatar online" style="margin:0; width:36px; height:36px; font-size:0.9rem;">V</div>
                    <h2>Vortex Node</h2>
                </div>
                <div class="security-badge">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    AES-256 E2E
                </div>
            </header>
            
            <div class="messages-container" id="chat-box">
                <div class="message received">
                    <div class="msg-content">Uplink established. Channel integrity verified. Welcome to the Nythic protocol.</div>
                    <div class="msg-meta">
                        <span>SYSTEM</span>
                        <span>•</span>
                        <span>14:47</span>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <button class="action-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </button>
                    <input type="text" id="message-input" placeholder="Initiate transmission..." autocomplete="off">
                    <button class="send-btn" onclick="sendMessage()">TRANSMIT</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Background Particle FX
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5;
                this.speedY = (Math.random() - 0.5) * 0.1;
                this.alpha = Math.random() * 0.4;
            }
            update() {
                this.y += this.speedY;
                if (this.y > height) this.y = 0;
                if (this.y < 0) this.y = height;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

        // App Transition
        setTimeout(() => {
            const reveal = document.getElementById('reveal-screen');
            const app = document.getElementById('chat-app');
            reveal.style.opacity = '0';
            reveal.style.transform = 'scale(0.95)';
            setTimeout(() => {
                reveal.style.display = 'none';
                app.classList.add('active');
            }, 1000);
        }, 3600);

        // Chat Logic
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text === '') return;

            const chatBox = document.getElementById('chat-box');
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            const msgHTML = `
                <div class="message sent">
                    <div class="msg-content">${text}</div>
                    <div class="msg-meta">
                        <span>YOU</span>
                        <span>•</span>
                        <span>${timeStr}</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-left:4px;"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>
            `;
            
            chatBox.insertAdjacentHTML('beforeend', msgHTML);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('message-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
